version: ci.{build}
clone_depth: 1
skip_tags: true
branches:
  only:
    - master

skip_branch_with_pr: true

# AppVeyor does not expose immutable VM image digests. These jobs remain useful
# for credential-free CI artifacts, but the release gate below stays closed.
image:
  - Visual Studio 2022
  - Ubuntu2204
  - macos-monterey

environment:
  PYTHON_VERSION: "3.11"
  QT_WINDOWS_VERSION: "6.8.3"
  QT_LINUX_VERSION: "6.8.3"
  QT_MACOS_VERSION: "6.5.3"
  # AppVeyor VM images and their preinstalled compilers/Qt SDKs have no
  # immutable digest. Jobs may build test artifacts, but cannot deploy them as
  # releases until the platform is migrated to a verified toolchain image.
  RELEASE_INPUTS_VERIFIED: "false"

init:

# Windows
# Setup QT 6.8 - 64Bit
- cmd: set QTDIR=C:\Qt\6.8\msvc2022_64
- cmd: set PATH=%QTDIR%\bin;%PATH%
- cmd: qmake --version
- ps: if ($isWindows -and ((qmake -query QT_VERSION) -ne $env:QT_WINDOWS_VERSION)) { throw "Unexpected Windows Qt version" }
# Setup MSVC - VS 2022
- cmd: call c:\"Program Files"\"Microsoft Visual Studio"\2022\Community\VC\Auxiliary\Build\vcvarsall.bat amd64
# Setup NSIS
- cmd: set PATH=%PATH%;C:\"Program Files (x86)"\NSIS
# Setup Python
- cmd: set PATH=C:\Python313-x64\Scripts\;C:\Python313-x64\;%PATH%
- cmd: python --version
# Setup JOM
- cmd: set PATH=%PATH%;C:\JOM\;
# Setup R
- cmd: set PATH=%PATH%;C:\R\bin\;

# Linux / macOS
- sh: >-
    if $CI_LINUX; then
      export OS_NAME=linux
      # Select gcc-11 for AppImage backward compatibility
      sudo update-alternatives --set gcc "/usr/bin/gcc-11"
      # Setup QT 6.8
      export QTDIR=$HOME/Qt/6.8
      export LD_LIBRARY_PATH=$QTDIR:$LD_LIBRARY_PATH
      export PATH=$QTDIR/bin:$PATH
      test "$(qmake -query QT_VERSION)" = "$QT_LINUX_VERSION"
    else
      export OS_NAME=macos
      # Setup QT 6.5
      export QTDIR=$HOME/Qt/6.5/macos
      export PATH=$QTDIR/bin:$PATH
      test "$(qmake -query QT_VERSION)" = "$QT_MACOS_VERSION"
      # Setup Xcode 14.2
      sudo xcode-select -s /Applications/Xcode-14.2.0.app
      test "$(xcodebuild -version | sed -n '1p')" = "Xcode 14.2"
    fi

cache:
# Release dependency trees are reconstructed from pinned inputs outside the
# source worktree. Mutable extracted trees are never restored from a cache.

install:

# Install dependencies first
 # Windows
- ps: if ($isWindows) { ./appveyor/windows/install.ps1 }
 # Linux / macOS
- sh: bash appveyor/$OS_NAME/install.sh

before_build:

# Configure src/gcconfig.pri
 # Windows
- ps: if ($isWindows) { appveyor\windows\before_build.ps1 }
 # Linux / macOS
- sh: bash appveyor/$OS_NAME/before_build.sh

# Enable unit tests
- cmd: copy /Y unittests\unittests.pri.in unittests\unittests.pri
- sh: cp unittests/unittests.pri.in unittests/unittests.pri

# For tagged builds, define GC version string
- ps: if ($env:APPVEYOR_REPO_TAG -eq "true") { Add-Content src/gcconfig.pri "DEFINES += GC_VERSION=VERSION_STRING" }

# Show config.
- ps: Get-Content src/gcconfig.pri

# update translations
- cmd: lupdate src\src.pro
- sh: lupdate src/src.pro

# Public CI artifacts are intentionally built without reusable provider secrets.

build_script:

# Windows
- cmd: qmake.exe build.pro -r -spec win32-msvc
- cmd: if not exist qwt\lib\qwt.lib jom -j1 sub-qwt
- cmd: jom -j2 sub-src
- cmd: jom -j2 sub-unittests

# Linux / macOS
- sh: qmake build.pro -r QMAKE_CXXFLAGS_WARN_ON+="-Wno-unused-private-field -Wno-c++11-narrowing -Wno-deprecated-declarations -Wno-deprecated-register -Wno-nullability-completeness -Wno-sign-compare -Wno-inconsistent-missing-override" QMAKE_CFLAGS_WARN_ON+="-Wno-deprecated-declarations -Wno-sign-compare"
- sh: if test ! -f qwt/lib/libqwt.a; then make -j2 sub-qwt; fi
- sh: make -j2 sub-src
- sh: make -j2 sub-unittests

after_build:

# Run Windows packaging regressions before the production packager so a
# packaging precondition failure cannot make its own regression unreachable.
- ps: if ($isWindows) { ./appveyor/windows/run-build-regressions.ps1 }

# Mutable AppVeyor jobs never publish. A future verified release pipeline must
# replace this hard gate rather than toggling a project environment variable.
- ps: Set-AppveyorBuildVariable -Name 'PUBLISH_BINARIES' -Value false

# Windows
- ps: if ($isWindows) { ./appveyor/windows/after_build.ps1 }

# Linux / macOS
- sh: bash appveyor/$OS_NAME/after_build.sh

test_script:

# Run platform-native packaging behavior tests explicitly. The qmake test
# project only registers the shell AppImage suite on Linux.
- sh: if ! $CI_LINUX; then bash appveyor/macos/run-build-regressions.sh; fi

# Windows
- cmd: python .github\scripts\run-tests.py --build-tool jom
- cmd: src\release\GoldenCheetah --version 2>GCversionWindows.txt
- cmd: git log -1 >> GCversionWindows.txt
- ps: if ($isWindows) { CertUtil -hashfile GoldenCheetah_v3.8_x64.exe sha256 | Select-Object -First 2 | Add-Content GCversionWindows.txt }
- cmd: type GCversionWindows.txt

# Linux / macOS
- sh: python3 .github/scripts/run-tests.py --build-tool make
- sh: >-
    if $CI_LINUX; then
      ./GoldenCheetah_v3.8_x64.AppImage --version 2>GCversionLinux.txt
      git log -1 >> GCversionLinux.txt
      shasum -a 256 GoldenCheetah_v3.8_x64.AppImage | cut -f 1 -d ' '  >> GCversionLinux.txt
      cat GCversionLinux.txt
    else
      src/GoldenCheetah.app/Contents/MacOS/GoldenCheetah --version 2>GCversionMacOS.txt
      git log -1 >> GCversionMacOS.txt
      shasum -a 256 GoldenCheetah_v3.8_x64.dmg | cut -f 1 -d ' ' >> GCversionMacOS.txt
      cat GCversionMacOS.txt
    fi

artifacts:
# Windows
- path: GoldenCheetah_v3.8_x64.exe
  name: GCwindowsInstaller
- path: GCversionWindows.txt
  name: GCversionWindows
# macOS
- path: GoldenCheetah_v3.8_x64.dmg
  name: GCmacOSpackage
- path: GoldenCheetah_v3.8_x64.macos-provenance.json
  name: GCmacOSprovenance
- path: GCversionMacOS.txt
  name: GCversionMacOS
# Linux
- path: GoldenCheetah_v3.8_x64.AppImage
  name: GClinuxAppImage
- path: GoldenCheetah_v3.8_x64.AppImage.manifest
  name: GClinuxAppImageManifest
- path: GoldenCheetah_v3.8_x64.AppImage.sbom.cdx.json
  name: GClinuxAppImageSbom
- path: GCversionLinux.txt
  name: GCversionLinux

deploy:
# deploy continuous builds to GitHub release
  - provider: GitHub
    auth_token:
      secure: 807DE/9vib/Kjz5Tah/Zc6zkoigLEWRzASw/DUWjLwZ5d8HHomXqWQ7iln4VtOqL
    tag: snapshot
    release: 'Snapshot Builds'
    description: ''
    artifact: GCwindowsInstaller, GCversionWindows, GCmacOSpackage, GCmacOSprovenance, GCversionMacOS, GClinuxAppImage, GClinuxAppImageManifest, GClinuxAppImageSbom, GCversionLinux
    draft: false
    prerelease: true
    force_update: true
    on:
      PUBLISH_BINARIES: true
      RELEASE_INPUTS_VERIFIED: true
      APPVEYOR_REPO_NAME: "GoldenCheetah/GoldenCheetah"
